services:
  web:
    build: .
    image: safehome-report:local
    # 내 PC에서만 접속 가능하도록 127.0.0.1 에만 바인딩
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 공공데이터 키·LLM 설정은 .env 로 런타임에만 주입한다 (없어도 기동되고 해당 기능만 안내 메시지를 보여준다)
    env_file:
      - path: .env
        required: false
    # 로그 파일이 무한정 커지지 않도록 회전 (docker compose logs -f web 으로 확인)
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
