name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    # 이미지가 빌드되고 컨테이너가 실제로 응답하는지 확인한다 (게시하지 않음)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t safehome-report:ci .
      - name: 컨테이너 기동 및 응답 확인
        run: |
          docker run -d --name app -p 127.0.0.1:3000:3000 --read-only --tmpfs /tmp safehome-report:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then echo "ok"; exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
      - name: 컨테이너가 non-root 로 실행되는지 확인
        run: test "$(docker exec app id -u)" != "0"
